<style>
  /*
    Semua ukuran pakai clamp(min, nilai-vw, max)
    → otomatis mengecil di layar kecil, membesar di layar besar
    → tidak perlu angka manual per breakpoint
  */

  #home {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    min-height: 88vh;
    
    /* JURUS PAKSA: Menggunakan margin-top agar konten terdorong ke bawah dari navbar */
    margin-top: 20vh !important; 
    
    /* Padding atas dinolkan karena sudah diganti margin, kiri-kanan 6vw, bawah 5vh */
    padding: 0 6vw 5vh !important; 
    
    gap: 4vw;
  }

  /* ── TEKS KIRI ── */
  #home .hero-left {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: clamp(12px, 2vh, 28px);  /* jarak antar elemen ikut tinggi layar */
    max-width: 55%;
  }

  #home .hero-left h1 {
    /* min 1.6rem → naik seiring lebar layar → max 6.5rem */
    font-size: clamp(1.6rem, 6vw, 8rem);
    font-weight: 900;
    color: #fff;
    line-height: 1.1;
    letter-spacing: -0.03em;
    margin: 0;
  }

  #home .hero-left h1 span { color: #22c55e; }

  #home .hero-left p {
    font-size: clamp(0.82rem, 1.5vw, 1.6rem);
    color: rgba(156, 163, 175, 0.85);
    line-height: 1.75;
    max-width: 90%;
    margin: 0;
  }

  #home .hero-left a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: clamp(9px, 1vh, 14px) clamp(18px, 2vw, 30px);
    background: #16a34a;
    color: #fff !important;
    font-weight: 700;
    font-size: clamp(0.78rem, 1vw, 1rem);
    border-radius: 50px;
    text-decoration: none;
    box-shadow: 0 0 24px rgba(15,188,109,0.25);
    transition: all 0.25s ease;
  }

  #home .hero-left a:hover {
    background: #15803d;
    transform: translateY(-2px);
    box-shadow: 0 0 36px rgba(15,188,109,0.4);
  }

  /* ── LOGO KANAN ── */
  #home .hero-right {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40%;
  }

  #home .hero-right img {
    /* logo ikut lebar viewport: min 160px → maks 560px */
    width: clamp(160px, 40vw, 650px);
    height: auto;
    filter:
      drop-shadow(0 0 2vw rgba(15,188,109,0.35))
      drop-shadow(0 0 5vw rgba(15,188,109,0.1));

  }

  @keyframes heroFloat {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(clamp(-8px, -1.5vh, -18px)); }
  }

  /* ── MOBILE (≤ 768px) ── */
  @media screen and (max-width: 768px) {
    #home {
      flex-direction: column !important;
      min-height: auto !important;
      
      /* JURUS PAKSA MOBILE: Sama seperti PC, kita pakai margin-top */
      margin-top: 50vw !important;
      padding: 0 5vw 10vw !important;
      
      gap: 6vw !important;
      align-items: center !important;
    }

    #home .hero-right {
      order: -1 !important;
      width: 100% !important;
    }

    #home .hero-right img {
      /* di HP: logo ikut lebar HP, antara 100px-200px */
      width: clamp(100px, 38vw, 200px) !important;
    }

    #home .hero-left {
      align-items: center !important;
      text-align: center !important;
      max-width: 100% !important;
      gap: clamp(10px, 3vw, 18px) !important;
    }

    #home .hero-left h1 {
      /* di HP: teks ikut lebar HP */
      font-size: clamp(1.4rem, 7vw, 2.2rem) !important;
    }

    #home .hero-left p {
      font-size: clamp(0.8rem, 3.5vw, 1rem) !important;
      max-width: 100% !important;
    }

    #home .hero-left a {
      font-size: clamp(0.78rem, 3.5vw, 0.9rem) !important;
    }

    /* Perlambat animasi fade-in */
    .fade-in {
      transition:
        opacity 1.1s cubic-bezier(0.23, 1, 0.32, 1),
        transform 1.1s cubic-bezier(0.23, 1, 0.32, 1) !important;
    }
  }
</style>

<style>
  .bday-section {
    display: none;
    width: 100%;
    padding: clamp(20px,4vh,36px) clamp(16px,5vw,48px);
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg,
      rgba(15,188,109,0.06) 0%,
      rgba(13,17,23,0.0) 50%,
      rgba(15,188,109,0.06) 100%
    );
    border-top: 1px solid rgba(15,188,109,0.15);
    border-bottom: 1px solid rgba(15,188,109,0.15);
  }

  /* Confetti dots dekoratif */
  .bday-section::before {
    content: '🎉 🎂 🎊 🎈 🎉 🎂 🎊 🎈 🎉 🎂';
    position: absolute;
    top: 6px; left: 0; right: 0;
    font-size: 0.75rem;
    letter-spacing: 0.6em;
    text-align: center;
    opacity: 0.18;
    pointer-events: none;
    white-space: nowrap;
    overflow: hidden;
  }

  .bday-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .bday-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: clamp(0.7rem, 1.5vw, 0.8rem);
    font-weight: 800;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #0fbc6d;
  }
  .bday-title span.bday-emoji {
    font-size: 1.4rem;
    animation: bdayBounce 1.2s ease-in-out infinite;
  }
  @keyframes bdayBounce {
    0%,100% { transform: translateY(0) rotate(-5deg); }
    50%      { transform: translateY(-5px) rotate(5deg); }
  }

  .bday-cards {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }

  .bday-card {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 18px;
    border-radius: 50px;
    background: rgba(15,188,109,0.08);
    border: 1px solid rgba(15,188,109,0.25);
    box-shadow: 0 0 16px rgba(15,188,109,0.07);
    animation: bdayPopIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  @keyframes bdayPopIn {
    from { opacity:0; transform: scale(0.7) translateY(10px); }
    to   { opacity:1; transform: scale(1) translateY(0); }
  }

  .bday-card-icon { font-size: 1.1rem; }

  .bday-card-name {
    font-size: clamp(0.85rem, 2vw, 0.95rem);
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.01em;
  }

  .bday-card-div {
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #0fbc6d;
    background: rgba(15,188,109,0.12);
    padding: 2px 7px;
    border-radius: 20px;
    border: 1px solid rgba(15,188,109,0.2);
  }

  .bday-wish {
    font-size: 0.78rem;
    color: rgba(255,255,255,0.4);
    font-style: italic;
    letter-spacing: 0.04em;
  }

  @media (max-width: 599px) {
    .bday-card { padding: 8px 14px; }
    .bday-card-name { font-size: 0.85rem; }
  }
</style>

<div id="bday-section" class="bday-section">
  <div class="bday-inner">
    <div class="bday-title">
      <span class="bday-emoji">🎂</span>
      Selamat Ulang Tahun!
      <span class="bday-emoji">🎉</span>
    </div>
    <div class="bday-cards" id="bday-cards"></div>
    <div class="bday-wish">Semoga sukses dan selalu semangat untuk HMTE 💚</div>
  </div>
</div>

<script>
(function(){
  var ICONS = ['🎂','🎉','🎊','🎈','🥳','✨'];
  function renderBday(){
    if(!window._membersData){ setTimeout(renderBday,100); return; }
    var t=new Date();
    var key=String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
    var found=(window._membersData||[]).filter(function(m){ return m.birthday===key; });
    if(!found.length) return;
    var cards=document.getElementById('bday-cards');
    var section=document.getElementById('bday-section');
    if(!cards||!section) return;
    cards.innerHTML=found.map(function(m,i){
      var icon=ICONS[i%ICONS.length];
      var delay=(i*0.1).toFixed(1);
      return '<div class="bday-card" style="animation-delay:'+delay+'s">'+
        '<span class="bday-card-icon">'+icon+'</span>'+
        '<span class="bday-card-name">'+m.name+'</span>'+
        (m.division?'<span class="bday-card-div">'+m.division+'</span>':'')+
      '</div>';
    }).join('');
    section.style.display='block';
  }
  if(window._membersData){ renderBday(); }
  else {
    var s=document.createElement('script');
    s.src='/js/data/members.js';
    s.onload=renderBday; s.onerror=renderBday;
    document.head.appendChild(s);
  }
})();
</script>
