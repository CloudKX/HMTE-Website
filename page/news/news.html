<head>

  <link rel="icon" type="image/png" href="/img/hmte-icon.png" />

  <!-- Tanpa Tailwind CDN -->
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/satoshi.css" />
  <link rel="stylesheet" href="/css/news.css" />

  <!-- Font Awesome hanya dipakai ikon header & footer, jadi dimuat tanpa menghalangi tampilan awal -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"

<body>

  <main class="news-wrap">

      </div>

      <nav id="news-pagination-container" class="news-pager" aria-label="Halaman berita"></nav>
