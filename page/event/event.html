<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Modal — HMTE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --bg:         #161616;
      --surface:    #1e1e1e;
      --surface-2:  #252525;
      --border:     rgba(255,255,255,0.07);
      --green:      #0fbc6d;
      --green-dim:  rgba(15,188,109,0.12);
      --green-glow: rgba(15,188,109,0.28);
      --text:       #f0f0f0;
      --muted:      #888;
      --font-mono:  'Space Mono', monospace;
      --font-body:  'DM Sans', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ══════════════════════════════════════
       OVERLAY
    ══════════════════════════════════════ */
    #ev-overlay {
      position: fixed; inset: 0; z-index: 800;
      background: rgba(8,8,8,0.78);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      opacity: 0; pointer-events: none;
      transition: opacity 0.32s cubic-bezier(.4,0,.2,1);
    }
    #ev-overlay.open { opacity: 1; pointer-events: all; }

    /* ══════════════════════════════════════
       MODAL BASE
    ══════════════════════════════════════ */
    #ev-modal {
      position: fixed;
      z-index: 900;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ══════════════════════════════════════
       DESKTOP
    ══════════════════════════════════════ */
    @media (min-width: 640px) {
      #ev-modal {
        top: 50%; left: 50%;
        transform: translate(-50%, calc(-50% + 28px));
        border-radius: 20px;
        background: rgba(24,24,24,0.90);
        backdrop-filter: blur(28px) saturate(1.5);
        -webkit-backdrop-filter: blur(28px) saturate(1.5);
        opacity: 0; pointer-events: none;
        transition:
          opacity 0.34s cubic-bezier(.4,0,.2,1),
          transform 0.34s cubic-bezier(.34,1.38,.64,1),
          width 0.3s ease,
          flex-direction 0s;
        width: min(560px, 92vw);
        max-height: 90vh;
      }
      #ev-modal.open {
        opacity: 1; pointer-events: all;
        transform: translate(-50%, -50%);
      }

      /* PORTRAIT — side by side */
      #ev-modal.layout-portrait {
        width: min(840px, 94vw);
        flex-direction: row;
        align-items: stretch;
      }
      /* SQUARE */
      #ev-modal.layout-square {
        width: min(600px, 92vw);
        flex-direction: column;
      }
      /* LANDSCAPE */
      #ev-modal.layout-landscape {
        width: min(560px, 92vw);
        flex-direction: column;
      }
    }

    /* ══════════════════════════════════════
       MOBILE — bottom sheet
    ══════════════════════════════════════ */
    @media (max-width: 639px) {
      #ev-modal {
        bottom: 0; left: 0; right: 0;
        width: 100%;
        max-height: 93dvh;
        border-radius: 24px 24px 0 0;
        box-shadow: 0 -6px 40px rgba(0,0,0,0.65), 0 0 40px var(--green-glow);
        transform: translateY(100%); pointer-events: none;
        transition: transform 0.42s cubic-bezier(.34,1.15,.64,1);
        flex-direction: column;
      }
      #ev-modal.open { transform: translateY(0); pointer-events: all; }
      #ev-modal::before {
        content: '';
        display: block;
        width: 38px; height: 4px; border-radius: 99px;
        background: rgba(255,255,255,0.14);
        margin: 11px auto 0;
        flex-shrink: 0;
      }
    }

    /* ══════════════════════════════════════
       POSTER COLUMN
    ══════════════════════════════════════ */
    #ev-poster-col {
      position: relative;
      flex-shrink: 0;
      overflow: hidden;
      background: #111;
    }

    /* Default — full-width strip */
    #ev-poster-col { width: 100%; }

    /* Landscape: shorter strip */
    .layout-landscape #ev-poster-col { aspect-ratio: 16/7; }

    /* Square: 4:3 strip */
    .layout-square #ev-poster-col { aspect-ratio: 4/3; }

    /* Portrait mobile: tall strip */
    @media (max-width: 639px) {
      .layout-portrait #ev-poster-col { aspect-ratio: 9/14; max-height: 55dvh; }
    }

    /* Portrait desktop: left sidebar, fixed width */
    @media (min-width: 640px) {
      .layout-portrait #ev-poster-col {
        width: 290px;
        aspect-ratio: auto;
        align-self: stretch;
      }
    }

    /* Poster image */
    #ev-poster {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: transform 7s ease, opacity 0.5s ease;
    }
    #ev-poster.loaded { opacity: 1; }
    #ev-modal.open #ev-poster { transform: scale(1.05); }

    /* Gradient overlay on poster */
    #ev-poster-col::after {
      content: '';
      position: absolute; inset: 0;
      pointer-events: none;
    }
    .layout-landscape #ev-poster-col::after,
    .layout-square    #ev-poster-col::after {
      background: linear-gradient(to top, rgba(24,24,24,0.97) 0%, rgba(24,24,24,0.1) 60%, transparent 100%);
    }
    @media (min-width: 640px) {
      .layout-portrait #ev-poster-col::after {
        background: linear-gradient(to right, transparent 65%, rgba(24,24,24,0.8) 100%);
      }
    }
    @media (max-width: 639px) {
      .layout-portrait #ev-poster-col::after {
        background: linear-gradient(to top, rgba(24,24,24,0.97) 0%, transparent 60%);
      }
    }

    /* Skeleton shimmer */
    #ev-poster-skeleton {
      position: absolute; inset: 0;
      background: linear-gradient(90deg, #1e1e1e 25%, #2a2a2a 50%, #1e1e1e 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      z-index: 1;
    }
    #ev-poster.loaded ~ #ev-poster-skeleton { display: none; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* No-image fallback */
    #ev-poster-fallback {
      position: absolute; inset: 0; z-index: 2;
      display: none;
      align-items: center; justify-content: center;
      flex-direction: column; gap: 8px;
      background: linear-gradient(135deg, #1a2e22 0%, #141414 100%);
    }
    #ev-poster-fallback i    { font-size: 2.8rem; color: rgba(15,188,109,0.18); }
    #ev-poster-fallback span { font-size: 0.7rem; color: #3a3a3a; font-family: var(--font-mono); }
    #ev-modal.no-image #ev-poster-fallback { display: flex; }
    #ev-modal.no-image #ev-poster-skeleton  { display: none; }

    /* Badge */
    #ev-badge {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 99px;
      background: rgba(10,10,10,0.68);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      font-family: var(--font-mono); font-size: 0.67rem;
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    #ev-badge-dot {
      width: 7px; height: 7px; border-radius: 50%;
      animation: pulseDot 2s infinite;
    }
    @keyframes pulseDot {
      0%,100%{ transform:scale(1); opacity:1; }
      50%    { transform:scale(1.6); opacity:0.5; }
    }

    /* Close btn */
    #ev-close-btn {
      position: absolute; top: 12px; right: 12px; z-index: 20;
      width: 34px; height: 34px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(8,8,8,0.68);
      backdrop-filter: blur(10px);
      color: var(--text);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 13px;
      transition: background 0.2s, transform 0.22s, border-color 0.2s;
    }
    #ev-close-btn:hover {
      background: rgba(220,38,38,0.38);
      border-color: rgba(220,38,38,0.55);
      transform: scale(1.1) rotate(90deg);
    }

    /* ══════════════════════════════════════
       BODY COLUMN
    ══════════════════════════════════════ */
    #ev-body {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 0 22px 26px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
      min-width: 0;
    }
    #ev-body::-webkit-scrollbar       { width: 4px; }
    #ev-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    /* Title area */
    #ev-title-area { position: relative; z-index: 5; }

    /* Title overlaps poster bottom for column layouts */
    .layout-landscape #ev-title-area,
    .layout-square    #ev-title-area { margin-top: -38px; }

    /* Portrait desktop: no overlap needed */
    @media (min-width: 640px) {
      .layout-portrait #ev-title-area { margin-top: 22px; }
    }
    /* Portrait mobile: overlap */
    @media (max-width: 639px) {
      .layout-portrait #ev-title-area { margin-top: -38px; }
    }

    #ev-category-tag {
      display: inline-flex; align-items: center; gap: 5px;
      font-family: var(--font-mono); font-size: 0.68rem;
      color: var(--green); text-transform: uppercase; letter-spacing: 0.08em;
      margin-bottom: 5px;
    }
    #ev-title {
      font-weight: 700;
      font-size: clamp(1.05rem, 3.2vw, 1.38rem);
      line-height: 1.25; color: var(--text);
      margin-bottom: 14px;
    }

    /* Meta chips */
    #ev-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .ev-meta-chip {
      display: inline-flex; align-items: flex-start; gap: 7px;
      padding: 7px 12px; border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 0.78rem; color: #ccc;
    }
    .ev-meta-chip i { color: var(--green); font-size: 0.72rem; margin-top: 2px; flex-shrink: 0; }

    #ev-maps-link {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 0.7rem; color: var(--green);
      text-decoration: none; margin-top: 3px; opacity: 0.8;
      transition: opacity 0.2s;
    }
    #ev-maps-link:hover { opacity: 1; }

    .ev-divider {
      height: 1px;
      background: linear-gradient(90deg, var(--green-dim), transparent);
      margin-bottom: 16px;
    }

    /* Description */
    #ev-description {
      font-size: 0.87rem; line-height: 1.76; color: #aaa;
      margin-bottom: 22px;
    }
    #ev-description p       { margin-bottom: 9px; }
    #ev-description strong  { color: var(--text); }
    #ev-description a       { color: var(--green); text-decoration: underline; }
    #ev-description ul,
    #ev-description ol      { margin: 8px 0 8px 18px; }
    #ev-description li      { margin-bottom: 4px; }

    /* CTA */
    #ev-cta-row { display: flex; gap: 10px; flex-wrap: wrap; }

    .ev-btn-primary {
      flex: 1; min-width: 130px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 18px; border-radius: 12px;
      background: var(--green); color: #000;
      font-family: var(--font-body); font-weight: 700; font-size: 0.87rem;
      text-decoration: none; border: none; cursor: pointer;
      box-shadow: 0 4px 20px var(--green-glow);
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    .ev-btn-primary:hover {
      background: #12d87c; transform: translateY(-2px);
      box-shadow: 0 8px 28px var(--green-glow);
    }
    .ev-btn-primary:active { transform: translateY(0); }

    .ev-btn-secondary {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 16px; border-radius: 12px;
      background: transparent; color: var(--muted);
      font-family: var(--font-body); font-weight: 600; font-size: 0.87rem;
      border: 1px solid var(--border); cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .ev-btn-secondary:hover {
      background: rgba(255,255,255,0.05); color: var(--text);
      border-color: rgba(255,255,255,0.14);
    }

    /* ══════════════════════════════════════
       DEMO PAGE
    ══════════════════════════════════════ */
    .demo-wrap { max-width: 960px; margin: 56px auto; padding: 0 20px; }
    .demo-label   { font-family: var(--font-mono); color: var(--green); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 5px; }
    .demo-heading { font-size: clamp(1.4rem, 4vw, 2.1rem); font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .demo-sub     { font-size: 0.84rem; color: var(--muted); margin-bottom: 32px; }
    .demo-sub b   { color: var(--green); }
    .demo-grid    { display: grid; grid-template-columns: repeat(auto-fill, minmax(228px, 1fr)); gap: 16px; }

    .demo-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; overflow: hidden; cursor: pointer;
      transition: transform 0.22s, box-shadow 0.22s, border-color 0.22s;
    }
    .demo-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 14px 44px rgba(0,0,0,0.5), 0 0 28px var(--green-glow);
      border-color: rgba(15,188,109,0.22);
    }
    .demo-card-thumb {
      width: 100%; aspect-ratio: 16/9;
      object-fit: cover; display: block; background: #1a1a1a;
    }
    .demo-card-body  { padding: 13px 15px; }
    .demo-card-date  { font-size: 0.7rem; font-family: var(--font-mono); margin-bottom: 5px; }
    .demo-card-title { font-weight: 700; font-size: 0.9rem; color: var(--text); line-height: 1.3; }
    .demo-card-loc   { font-size: 0.74rem; color: var(--muted); margin-top: 5px; }
    .demo-ratio-tag  {
      display: inline-block; margin-top: 7px;
      padding: 2px 8px; border-radius: 5px;
      font-size: 0.62rem; font-family: var(--font-mono);
      border: 1px solid var(--border); color: #555;
    }
  </style>
</head>
<body>

<!-- ══════════════════════════════════════
     DEMO PAGE
══════════════════════════════════════ -->
<div class="demo-wrap">
  <p class="demo-label">// HMTE UNSOED — Event Modal v2</p>
  <h1 class="demo-heading">Kalender Kegiatan</h1>
  <p class="demo-sub">
    Klik kartu untuk membuka modal. Poster <b>otomatis mendeteksi rasio gambar</b> — flyer portrait
    9:16, banner landscape 16:9, atau square — dan menyesuaikan layout tanpa konfigurasi manual.
  </p>
  <div class="demo-grid" id="demo-cards"></div>
</div>

<!-- ══════════════════════════════════════
     OVERLAY
══════════════════════════════════════ -->
<div id="ev-overlay" aria-hidden="true"></div>

<!-- ══════════════════════════════════════
     MODAL / BOTTOM SHEET
══════════════════════════════════════ -->
<div id="ev-modal" role="dialog" aria-modal="true" aria-labelledby="ev-title">

  <!-- Poster column -->
  <div id="ev-poster-col">
    <div id="ev-poster-skeleton"></div>
    <div id="ev-poster-fallback">
      <i class="far fa-calendar-alt"></i>
      <span>no poster</span>
    </div>
    <img id="ev-poster" src="" alt="Poster Event" />
    <span id="ev-badge">
      <span id="ev-badge-dot"></span>
      <span id="ev-badge-text">Mendatang</span>
    </span>
    <button id="ev-close-btn" aria-label="Tutup"><i class="fas fa-times"></i></button>
  </div>

  <!-- Body / content column -->
  <div id="ev-body">
    <div id="ev-title-area">
      <div id="ev-category-tag">
        <i class="fas fa-bolt"></i>
        <span id="ev-category">Kegiatan</span>
      </div>
      <h2 id="ev-title">—</h2>
    </div>

    <div id="ev-meta">
      <div class="ev-meta-chip">
        <i class="far fa-calendar-alt"></i>
        <span id="ev-date">—</span>
      </div>
      <div class="ev-meta-chip">
        <i class="far fa-clock"></i>
        <span id="ev-time">—</span>
      </div>
      <div class="ev-meta-chip">
        <i class="fas fa-map-marker-alt"></i>
        <div>
          <div id="ev-location">—</div>
          <a id="ev-maps-link" href="#" target="_blank" rel="noopener">
            <i class="fas fa-external-link-alt"></i> Buka Maps
          </a>
        </div>
      </div>
    </div>

    <div class="ev-divider"></div>
    <div id="ev-description"></div>

    <div id="ev-cta-row">
      <a id="ev-btn-reg" href="#" target="_blank" rel="noopener" class="ev-btn-primary">
        <i class="fas fa-ticket-alt"></i> Daftar Sekarang
      </a>
      <button class="ev-btn-secondary" onclick="closeEventModal()">
        <i class="fas fa-times"></i> Tutup
      </button>
    </div>
  </div>

</div><!-- /#ev-modal -->


<script>
/* ════════════════════════════════════════════════════════
   EVENT MODAL ENGINE — AUTO ADAPTIVE POSTER LAYOUT

   PUBLIC API:
     openEventModal(eventObj)   — buka modal dengan data event
     closeEventModal()          — tutup modal

   Layout ditentukan otomatis dari naturalWidth/naturalHeight:
     ratio < 0.72  → "portrait"   (story/flyer 9:16 atau 3:4)
     ratio > 1.40  → "landscape"  (banner 16:9, 2:1)
     else          → "square"     (~1:1 atau 4:3)

   eventObj fields (sesuai events.json):
     title, date, time, location, locationLink,
     description, content, imgSrc,
     registrationLink, driveLink, link,
     color ("green"|"blue"|"yellow"),
     category, isFeatured
════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  /* ── DOM refs ── */
  var overlay    = document.getElementById('ev-overlay');
  var modal      = document.getElementById('ev-modal');
  var poster     = document.getElementById('ev-poster');
  var badgeDot   = document.getElementById('ev-badge-dot');
  var badgeEl    = document.getElementById('ev-badge');
  var badgeText  = document.getElementById('ev-badge-text');
  var titleEl    = document.getElementById('ev-title');
  var categoryEl = document.getElementById('ev-category');
  var dateEl     = document.getElementById('ev-date');
  var timeEl     = document.getElementById('ev-time');
  var locationEl = document.getElementById('ev-location');
  var mapsLink   = document.getElementById('ev-maps-link');
  var descEl     = document.getElementById('ev-description');
  var btnReg     = document.getElementById('ev-btn-reg');
  var body       = document.getElementById('ev-body');

  /* ── Palettes ── */
  var C = {
    green:  { dot:'#0fbc6d', bg:'rgba(15,188,109,0.16)',  glow:'rgba(15,188,109,0.28)',  label:'Mendatang' },
    blue:   { dot:'#06b6d4', bg:'rgba(6,182,212,0.16)',   glow:'rgba(6,182,212,0.26)',   label:'Seminar'   },
    yellow: { dot:'#eab308', bg:'rgba(234,179,8,0.16)',   glow:'rgba(234,179,8,0.26)',   label:'Informal'  },
    gray:   { dot:'#6b7280', bg:'rgba(107,114,128,0.16)', glow:'rgba(107,114,128,0.2)',  label:'Kegiatan'  },
  };

  var LAYOUTS = ['layout-landscape','layout-portrait','layout-square'];
  function setLayout(name) {
    LAYOUTS.forEach(function(c){ modal.classList.remove(c); });
    modal.classList.add('layout-' + name);
  }

  /* ── Detect layout from image natural dimensions ── */
  function detectLayout(img) {
    var w = img.naturalWidth, h = img.naturalHeight;
    if (!w || !h) return 'landscape';
    var r = w / h;
    if (r < 0.72) return 'portrait';  // tall: 9:16, 2:3, 3:4
    if (r > 1.40) return 'landscape'; // wide: 16:9, 2:1, 3:1
    return 'square';                   // ~1:1, 4:3, 3:2
  }

  /* ── Helpers ── */
  function fmtDate(ds) {
    if (!ds) return '—';
    return new Date(ds.replace(/-/g,'/')).toLocaleDateString('id-ID',
      { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  }
  function isPast(ds) {
    if (!ds) return false;
    var d=new Date(ds); d.setHours(0,0,0,0);
    var n=new Date();   n.setHours(0,0,0,0);
    return d < n;
  }
  function toHTML(str) {
    if (!str) return '<p style="color:#555;font-style:italic;">Tidak ada deskripsi.</p>';
    if (/<[a-z][\s\S]*>/i.test(str)) return str;
    return str.split(/\n\s*\n/).map(function(p){
      return '<p>'+p.trim().replace(/\n/g,'<br>')+'</p>';
    }).join('');
  }

  /* ── Scroll lock ── */
  var _sy = 0;
  function lockScroll()   { _sy=window.scrollY; document.body.style.cssText='overflow:hidden;position:fixed;top:-'+_sy+'px;left:0;right:0;'; }
  function unlockScroll() { document.body.style.cssText=''; window.scrollTo(0,_sy); }

  /* ════════════════════
     OPEN
  ════════════════════ */
  window.openEventModal = function (ev) {
    if (!ev) return;
    var col  = C[ev.color] || C.gray;
    var past = isPast(ev.date);

    /* ── Poster ── */
    poster.classList.remove('loaded');
    modal.classList.remove('no-image');
    setLayout('landscape'); // default while loading

    if (ev.imgSrc) {
      var src = ev.imgSrc;
      if (!src.startsWith('http') && !src.startsWith('/')) src = '/' + src;
      poster.style.display = 'block';

      poster.onload = function () {
        poster.classList.add('loaded');
        setLayout(detectLayout(poster));
        body.scrollTop = 0; // reset scroll after layout shift
      };
      poster.onerror = function () {
        modal.classList.add('no-image');
        poster.style.display = 'none';
      };
      poster.src = src;
    } else {
      poster.style.display = 'none';
      modal.classList.add('no-image');
    }

    /* ── Badge & glow ── */
    badgeDot.style.background = col.dot;
    badgeEl.style.background  = col.bg;
    badgeText.textContent     = past ? 'Selesai' : col.label;
    modal.style.boxShadow     =
      '0 0 0 1px rgba(255,255,255,0.07),0 36px 90px rgba(0,0,0,0.7),0 0 60px ' + col.glow;

    /* ── Content ── */
    titleEl.textContent    = ev.title    || 'Tanpa Judul';
    categoryEl.textContent = ev.category || (past ? 'Kegiatan Selesai' : col.label);
    dateEl.textContent     = fmtDate(ev.date);
    timeEl.textContent     = ev.time     || 'Waktu menyusul';
    locationEl.textContent = ev.location || 'Lokasi menyusul';

    if (ev.locationLink) {
      mapsLink.href = ev.locationLink;
      mapsLink.style.display = 'inline-flex';
    } else {
      mapsLink.style.display = 'none';
    }
    descEl.innerHTML = toHTML(ev.content || ev.description || '');

    /* ── CTA ── */
    if (past) {
      var doc = ev.driveLink || ev.link || null;
      if (doc) {
        btnReg.href      = doc;
        btnReg.innerHTML = '<i class="fas fa-folder-open"></i> Lihat Dokumentasi';
        btnReg.style.display = 'inline-flex';
      } else { btnReg.style.display = 'none'; }
    } else if (ev.registrationLink) {
      btnReg.href      = ev.registrationLink;
      btnReg.innerHTML = '<i class="fas fa-ticket-alt"></i> Daftar Sekarang';
      btnReg.style.display = 'inline-flex';
    } else { btnReg.style.display = 'none'; }

    /* ── Show ── */
    lockScroll();
    overlay.classList.add('open');
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ modal.classList.add('open'); });
    });
    body.scrollTop = 0;
  };

  /* ════════════════════
     CLOSE
  ════════════════════ */
  window.closeEventModal = function () {
    modal.classList.remove('open');
    overlay.classList.remove('open');
    unlockScroll();
    setTimeout(function(){
      poster.src = ''; poster.classList.remove('loaded');
      descEl.innerHTML = '';
      LAYOUTS.forEach(function(c){ modal.classList.remove(c); });
    }, 450);
  };

  /* ── Dismiss triggers ── */
  overlay.addEventListener('click', window.closeEventModal);
  document.getElementById('ev-close-btn').addEventListener('click', window.closeEventModal);
  document.addEventListener('keydown', function(e){
    if (e.key==='Escape' && modal.classList.contains('open')) window.closeEventModal();
  });

  /* ── Mobile swipe-to-dismiss ── */
  var _ts=0, _drag=false;
  modal.addEventListener('touchstart', function(e){ _ts=e.touches[0].clientY; _drag=true; },{passive:true});
  modal.addEventListener('touchmove',  function(e){
    if(!_drag) return;
    var d=e.touches[0].clientY-_ts;
    if(d>0) modal.style.transform='translateY('+d+'px)';
  },{passive:true});
  modal.addEventListener('touchend', function(e){
    if(!_drag) return; _drag=false;
    var d=e.changedTouches[0].clientY-_ts;
    if(d>110){
      modal.style.transition='transform 0.28s ease';
      modal.style.transform='translateY(100%)';
      overlay.classList.remove('open'); unlockScroll();
      setTimeout(function(){ modal.classList.remove('open'); modal.style.transform=''; modal.style.transition=''; },300);
    } else {
      modal.style.transition='transform 0.3s cubic-bezier(.34,1.4,.64,1)';
      modal.style.transform='translateY(0)';
      setTimeout(function(){ modal.style.transform=''; modal.style.transition=''; },320);
    }
  },{passive:true});

})();
