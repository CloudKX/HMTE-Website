name: Optimasi Gambar Otomatis

# Berjalan otomatis setiap admin panel (Decap CMS) menyimpan foto atau data,
# dan bisa dijalankan manual lewat tab Actions -> "Run workflow".
on:
  push:
    branches: [main]
    paths:
      - "img/uploads/**"
      - "js/data/json/**"
  workflow_dispatch:

permissions:
  contents: write

# Satu proses pada satu waktu supaya commit hasil optimasi tidak saling bertabrakan.
concurrency:
  group: optimize-images
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang Pillow
        run: pip install pillow

      - name: Jalankan optimasi gambar
        run: python tools/optimize_images.py

      - name: Simpan hasil ke repo
        run: |
          git add -A img js/data/json
          if git diff --cached --quiet; then
            echo "Tidak ada gambar yang perlu dioptimasi."
            exit 0
          fi
          git config user.name "hmte-image-bot"
          git config user.email "hmte-image-bot@users.noreply.github.com"
          git commit -m "chore: optimasi gambar otomatis (WebP)"
          # kalau admin panel sempat menyimpan lagi saat proses berjalan, gabungkan dulu lalu push
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "Gagal push setelah 3 percobaan" && exit 1
